# =============================================================================
# cloudbuild.yaml — Pipeline CI/CD completa AiChain CRM
#
# Trigger: push su branch 'main'
# Configurazione Cloud Build trigger in GCP Console:
#   - Source: questo repository
#   - Branch: ^main$
#   - Config: cloudbuild.yaml (root)
#
# Variabili sostituzione (da configurare nel trigger Cloud Build):
#   _REGION          = europe-west1
#   _REGISTRY        = europe-west1-docker.pkg.dev/$PROJECT_ID/crm
#   _BACKEND_SERVICE = crm-backend
#   _FRONTEND_SERVICE= crm-frontend
#   _FIREBASE_PROJECT= level-facility-479122-u4
#   _NEXT_PUBLIC_FIREBASE_API_KEY = (dalla Console Firebase)
#   _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN = ...
#   _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = ...
#   _NEXT_PUBLIC_FIREBASE_APP_ID = ...
# =============================================================================

substitutions:
  _REGION: europe-west1
  _REGISTRY: europe-west1-docker.pkg.dev/$PROJECT_ID/crm
  _BACKEND_SERVICE: crm-backend
  _FRONTEND_SERVICE: crm-frontend
  _FIREBASE_PROJECT: level-facility-479122-u4
  _FIREBASE_STORAGE_BUCKET: level-facility-479122-u4.appspot.com
  _NEXT_PUBLIC_FIREBASE_API_KEY: ""
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: level-facility-479122-u4.firebaseapp.com
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: level-facility-479122-u4
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: level-facility-479122-u4.appspot.com
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "722754739274"
  _NEXT_PUBLIC_FIREBASE_APP_ID: ""

steps:

  # ── 1. TEST BACKEND ────────────────────────────────────────────────────────
  - id: backend-test
    name: python:3.12-slim
    dir: backend
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q -r requirements.txt
        pip install -q pytest httpx
        pytest tests/ -v --tb=short
    env:
      - "FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT}"

  # ── 2. BUILD BACKEND ───────────────────────────────────────────────────────
  - id: backend-build
    name: gcr.io/cloud-builders/docker
    dir: backend
    args:
      - build
      - -t
      - ${_REGISTRY}/backend:$SHORT_SHA
      - -t
      - ${_REGISTRY}/backend:latest
      - .
    waitFor: [backend-test]

  # ── 3. PUSH BACKEND ────────────────────────────────────────────────────────
  - id: backend-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/backend
    waitFor: [backend-build]

  # ── 4. DEPLOY BACKEND ──────────────────────────────────────────────────────
  - id: backend-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_REGISTRY}/backend:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=${_BACKEND_SERVICE}@$PROJECT_ID.iam.gserviceaccount.com
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=30
      - --set-env-vars=FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT}
      - --set-env-vars=FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}
      - --set-env-vars=GCP_LOCATION=${_REGION}
      - --set-env-vars=CLOUD_TASKS_QUEUE=crm-tasks
      - --set-env-vars=EMAIL_FROM=noreply@aichainsolutions.net
      - --set-env-vars=DEBUG=false
      - --set-env-vars=RATE_LIMIT_PER_MINUTE=60
      - --set-secrets=GOOGLE_APPLICATION_CREDENTIALS_JSON=firebase-credentials:latest
      - --set-secrets=RESEND_API_KEY=resend-api-key:latest
      - --set-secrets=MONGODB_URI=mongodb-uri:latest
      - --set-secrets=META_ACCESS_TOKEN=meta-access-token:latest
      - --set-secrets=META_AD_ACCOUNT_ID=meta-ad-account-id:latest
    waitFor: [backend-push]

  # ── 5. RECUPERA URL BACKEND e imposta BACKEND_INTERNAL_URL ───────────────────
  - id: backend-get-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --project=$PROJECT_ID \
          --format="value(status.url)")
        echo "BACKEND_URL=$${BACKEND_URL}"
        echo "$${BACKEND_URL}" > /workspace/backend_url.txt
        # BACKEND_INTERNAL_URL usata dai Cloud Tasks per i callback verso il backend
        gcloud run services update ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --project=$PROJECT_ID \
          --set-env-vars="BACKEND_INTERNAL_URL=$${BACKEND_URL}" \
          --quiet
        echo "✓ BACKEND_INTERNAL_URL impostato a $${BACKEND_URL}"
    waitFor: [backend-deploy]

  # ── 6. BUILD FRONTEND ──────────────────────────────────────────────────────
  - id: frontend-build
    name: gcr.io/cloud-builders/docker
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        docker build \
          -t ${_REGISTRY}/frontend:$SHORT_SHA \
          -t ${_REGISTRY}/frontend:latest \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY} \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN} \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID} \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET} \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID} \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID} \
          .
    waitFor: [backend-get-url]

  # ── 7. PUSH FRONTEND ───────────────────────────────────────────────────────
  - id: frontend-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/frontend
    waitFor: [frontend-build]

  # ── 8. DEPLOY FRONTEND ─────────────────────────────────────────────────────
  - id: frontend-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --image=${_REGISTRY}/frontend:$SHORT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --service-account=${_FRONTEND_SERVICE}@$PROJECT_ID.iam.gserviceaccount.com \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=5 \
          --concurrency=80 \
          --timeout=30 \
          --set-env-vars="BACKEND_URL=$${BACKEND_URL}" \
          --set-env-vars="NODE_ENV=production"
    waitFor: [frontend-push]

  # ── 9. AGGIORNA ALLOWED_ORIGINS NEL BACKEND ────────────────────────────────
  - id: update-cors
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        FRONTEND_URL=$(gcloud run services describe ${_FRONTEND_SERVICE} \
          --region=${_REGION} \
          --project=$PROJECT_ID \
          --format="value(status.url)")
        gcloud run services update ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --project=$PROJECT_ID \
          --set-env-vars="ALLOWED_ORIGINS=[\"$${FRONTEND_URL}\",\"https://crm.aichainsolutions.net\"]" \
          --quiet
        echo "✓ CORS aggiornato: ALLOWED_ORIGINS include $${FRONTEND_URL}"
    waitFor: [frontend-deploy]

images:
  - ${_REGISTRY}/backend:$SHORT_SHA
  - ${_REGISTRY}/frontend:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s  # 30 minuti
