<body class="bg-surface-dim min-h-screen flex items-center justify-center p-4 sm:p-8 antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<main class="w-full max-w-[420px]">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-8">
<div class="h-12 w-12 bg-primary rounded-xl flex items-center justify-center mb-4 shadow-sm border border-primary">
<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">
                    data_usage
                </span>
</div>
<h1 class="font-display text-display text-on-surface">AiChain</h1>
<p class="font-body text-body text-on-surface-variant mt-1">Enterprise CRM</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-8 shadow-[0_4px_12px_rgba(0,0,0,0.03)]">
<div class="mb-6">
<h2 class="font-h2 text-h2 text-on-surface">Sign In</h2>
<p class="font-body text-body text-on-surface-variant mt-1">Enter your details to access your account.</p>
</div>
<form class="flex flex-col gap-stack_gap">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-small-medium text-small-medium text-on-surface" for="email">Email Address</label>
<input class="h-input_height px-3 bg-surface-container-lowest border border-outline-variant rounded font-body text-body text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-small-medium text-small-medium text-on-surface" for="password">Password</label>
<a class="font-small-medium text-small-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<input class="h-input_height px-3 bg-surface-container-lowest border border-outline-variant rounded font-body text-body text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Primary Submit -->
<button class="h-input_height w-full mt-2 bg-primary text-on-primary font-body-medium text-body-medium rounded hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-6">
<div class="flex-grow border-t border-outline-variant/60"></div>
<span class="flex-shrink-0 mx-4 font-small text-small text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="flex-grow border-t border-outline-variant/60"></div>
</div>
<!-- Secondary Action -->
<button class="h-input_height w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-medium text-body-medium rounded hover:bg-surface-container-low active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button">
<svg class="w-4 h-4" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
</div>

<div class="mt-8 text-center">
<p class="font-small text-small text-on-surface-variant">

                <a class="underline hover:text-on-surface transition-colors" href="#">Terms of Service</a> and
